[project]
name = "edu-flow-ml"
version = "1.0.0"
description = "Edu-Flow-AI Python 侧 — 排课引擎(scheduler) + 导入训练闭环(ingest) + FastAPI 服务(app)"
requires-python = ">=3.13"
# macOS 另需: brew install libomp (lightgbm 的 OpenMP 运行时)
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "lightgbm>=4.6",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "pydantic>=2.10",
    "python-dotenv>=1.1",
    "pymysql>=1.1",
    "xlrd>=2.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scheduler", "ingest"]
